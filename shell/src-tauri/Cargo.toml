[package]
name = "mini-hub"
version = "0.1.0"
description = "Mini Hub: a personal control centre for Mini"
edition = "2021"
publish = false

[lib]
name = "mini_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
keyring = { version = "3", features = ["windows-native"] }
getrandom = "0.3"
ureq = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
